[package]
name = "titaou-poscrm"
version = "0.6.5"
description = "TitaouPosCRM — POS & TitaouCRM admin station (offline-first + Supabase cloud sync)"
edition = "2021"

[lib]
name = "titaou_poscrm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["devtools"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-process = "2.0.0"
tauri-plugin-single-instance = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
aes-gcm = "0.10"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
parking_lot = "0.12"
thiserror = "1.0"
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
# LAN shop networking: mDNS discovery (pure Rust, no Bonjour needed) + a
# WebSocket CLIENT for real-time server events (axum already serves WS).
mdns-sd = "0.11"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_Storage_FileSystem",
] }
png = "0.17"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
